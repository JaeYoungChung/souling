<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6366f1" />
    <meta
      name="description"
      content="Create positive change in your life with Souling! Grow your own character by practicing simple routines in everyday life."
    />
    <meta name="keywords" content="habit, routine, daily, grow, todo, self-improvement, focus, mindfulness, app" />
    <meta name="author" content="Souling" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.ico" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!-- Google Font: Ysabeau -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Jua&display=swap" rel="stylesheet">
    <title>Souling: Life-changing Habits</title>

    <!-- 페이지별 canonical / og:* 는 빌드 후 scripts/generate-og-pages.js 가 덮어쓴다 -->
    <link rel="canonical" href="https://souling.netlify.app/" />

    <!-- Open Graph / social + site name signals -->
    <meta property="og:site_name" content="Souling" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Souling: Life-changing Habits" />
    <meta
      property="og:description"
      content="Create positive change in your life with Souling! Grow your own character by practicing simple routines in everyday life."
    />
    <meta property="og:url" content="https://souling.netlify.app/" />
    <meta property="og:image" content="https://souling.netlify.app/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Souling — Life-changing Habits" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://souling.netlify.app/og-cover.png" />

    <!-- Structured data: tells Google the site name -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Souling",
        "url": "https://souling.netlify.app/"
      }
    </script>

    <!-- Structured data: the app itself, so brand searches can show the stores -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MobileApplication",
        "name": "Souling",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "iOS, Android",
        "description": "Souling turns simple daily routines into lifelong habits. Collect routines, grow your character, and track 24 strengths as you go.",
        "url": "https://souling.netlify.app/",
        "installUrl": [
          "https://apps.apple.com/kr/app/souling-daily-habit-companion/id6747715469",
          "https://play.google.com/store/apps/details?id=com.vivosvoco.souling"
        ],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "publisher": {
          "@type": "Organization",
          "name": "Vivos Voco Inc.",
          "url": "https://souling.netlify.app/",
          "sameAs": [
            "https://www.instagram.com/souling.app/",
            "https://www.threads.net/@souling.app"
          ]
        }
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
